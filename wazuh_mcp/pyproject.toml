[project]
name = "wazuh-mcp"
version = "0.1.0"
description = "Read-only MCP server (Streamable HTTP) for a local Wazuh LAB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
wazuh-mcp = "wazuh_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.4.6,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wazuh_mcp"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs the running Wazuh lab (lab/lab.sh up + users)"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]
